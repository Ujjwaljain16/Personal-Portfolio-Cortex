name: Sync GitHub data

# Keeps the open-source list, the "Now" section and the last-commit dates current with no manual work.
# Every day it reads my public pull requests and repositories from GitHub. If anything changed it runs the same
# checks as CI and, only if they pass, commits the new data to main, which Vercel then deploys.
# A failed run (GitHub is down, a check broke) leaves main untouched and emails the repository owner.

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC; off the hour because GitHub delays top-of-hour scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --no-warnings scripts/sync-github.mjs | tee sync.log

      - name: Did the data change?
        id: diff
        run: |
          if git diff --quiet -- src/data/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The new data goes through everything a hand edit would, so a bad title or a broken build cannot reach main.
      - name: Checks
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm run validate:data
          npm test
          npm run build

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated
          { echo "chore(data): sync GitHub data"; echo; grep '^  +' sync.log || true; } > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git pull --rebase origin main
          git push origin HEAD:main
